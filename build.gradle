	inputs.dir snippetsDir
	outputDir = file('docs/asciidoc')
	separateOutputDirs = false
	dependsOn test
}
*/
test {
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}
