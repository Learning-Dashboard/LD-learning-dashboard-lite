buildscript {
	ext {
		springBootVersion = '2.7.18'
		jjwtVersion = '0.11.5'
		gsonVersion = '2.14.0'
		postgresqlVersion = '42.7.11'
		mongodbDriverVersion = '4.11.5'
		commonsIoVersion = '2.22.0'
		commonsCodecVersion = '1.22.0'
		snippetsDir = file('build/generated-snippets')
	}
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
		//classpath 'org.asciidoctor:asciidoctor-gradle-plugin:1.5.9.2'
	}
}

plugins {
	id "org.sonarqube" version "2.7"
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'war'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'
//apply plugin: 'org.asciidoctor.convert'

group = 'com.upc.gessi.qrapids'
version = '3.3'

java {
	// The deployed Tomcat image runs on JRE 21; keep WAR bytecode compatible with older JVMs.
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}


war {
	from 'README.md'
	archiveBaseName = 'learning-dashboard'
	archiveVersion =  project.version
	webXml = file('src/main/resources/web.xml')
	from ('src/main/resources') {
		include 'Logs-servlet.xml'
		into 'WEB-INF'
	}
	enabled = true
}
bootWar {
	from 'README.md'
	archiveBaseName = 'learning-dashboard'
	archiveVersion =  project.version
	webXml = file('src/main/resources/web.xml')
	from ('src/main/resources') {
		include 'Logs-servlet.xml'
		into 'WEB-INF'
	}
	enabled = true
}

/*
bootJar {
	baseName = 'learning-dashboard'
    version = version
    enabled = true
}
*/
repositories {
	mavenCentral()
}

configurations.configureEach {
	exclude group: 'org.apache.logging.log4j'
}

dependencies {

	// Security
	implementation("org.springframework.boot:spring-boot-starter-security")

	// JWT
	implementation("io.jsonwebtoken:jjwt-api:${jjwtVersion}")
	runtimeOnly("io.jsonwebtoken:jjwt-impl:${jjwtVersion}")
	runtimeOnly("io.jsonwebtoken:jjwt-jackson:${jjwtVersion}")

	// Development
	developmentOnly('org.springframework.boot:spring-boot-devtools')

	// Spring Boot
	implementation('org.springframework.boot:spring-boot-starter-actuator')
	implementation('org.springframework.boot:spring-boot-starter-data-jpa')
	implementation('org.springframework.boot:spring-boot-starter-thymeleaf')
	implementation('org.springframework.boot:spring-boot-starter-web')
	implementation('org.springframework.boot:spring-boot-starter-validation')

	// Spring mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Database JDBC
	runtimeOnly("org.postgresql:postgresql:${postgresqlVersion}")

	// JSON Java Library
	implementation "com.google.code.gson:gson:${gsonVersion}"

	// Socket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Utils
	implementation "commons-io:commons-io:${commonsIoVersion}"
	implementation "commons-codec:commons-codec:${commonsCodecVersion}"

	// MongoDB API
	implementation("org.mongodb:mongodb-driver-sync:${mongodbDriverVersion}")
	implementation files('libs/LD-qma-mongo-1.0.jar')

	// Rest API Documentation
	implementation('org.springdoc:springdoc-openapi-ui:1.8.0')
	//asciidoctor 'org.springframework.restdocs:spring-restdocs-asciidoctor'

	// Testing
	testImplementation('org.springframework.boot:spring-boot-starter-test')
	testImplementation('junit:junit:4.13.2')
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation('com.h2database:h2:1.4.200')
	// Comment this line to launch application from developing environment
	// Uncomment this line before generating .war file
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

}

jacoco {
	toolVersion = "0.8.8"
}

jacocoTestReport {
	reports {
		xml.required = true
		html.required = true
	}
}
